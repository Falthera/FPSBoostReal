name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: gradle build

      - name: Create next tag
        id: tag
        shell: bash
        run: |
          git fetch --tags

          LAST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="v1.0.0"
          else
            VERSION=$(echo "$LAST_TAG" | sed 's/^v//' | awk -F. '{printf "v%d.%d.%d",$1,$2,$3+1}')
          fi

          echo "Creating release $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.version }}" \
            --title "FourTripleVictory ${{ steps.tag.outputs.version }}" \
            --notes "Auto-generated release" \
            build/libs/*.jar
